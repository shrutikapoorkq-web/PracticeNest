  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#F0EFFE;font-family:sans-serif;-webkit-font-smoothing:antialiased}
    #root{min-height:100vh}
    #splash-screen{
      position:fixed;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      background:linear-gradient(135deg,#6C63FF,#FF6B6B);
      color:#fff;gap:12px;text-align:center;padding:24px;z-index:9999
    }
    #splash-screen img{width:110px;height:110px;object-fit:contain;border-radius:20px;
      box-shadow:0 8px 32px rgba(0,0,0,.3)}
    #splash-screen h1{font-size:34px;font-weight:900}
    #splash-screen p{font-size:15px;opacity:.9}
    #load-status{font-size:13px;opacity:.75;min-height:20px;margin-top:4px}
    #progress-bar{width:200px;height:5px;background:rgba(255,255,255,.25);
      border-radius:4px;overflow:hidden;margin-top:6px}
    #progress-fill{height:100%;width:0%;background:#fff;border-radius:4px;
      transition:width .4s ease}
    .dot{animation:blink 1.4s infinite both;display:inline-block}
    .dot:nth-child(2){animation-delay:.2s}
    .dot:nth-child(3){animation-delay:.4s}
    @keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}
  </style>
</head>
